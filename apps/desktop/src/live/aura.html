<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src https://api.heyditto.ai wss://api.heyditto.ai"
    />
    <title>Ditto Live</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      .aura {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* The client renders the orb inside #aura-orb; only .aura-hit areas take clicks. */
      .aura-orb {
        position: absolute;
        inset: 34px;
        border-radius: 50%;
        cursor: grab;
      }
      .aura-orb:active {
        cursor: grabbing;
      }
      .aura-controls {
        position: absolute;
        top: 22px;
        right: 22px;
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: opacity 120ms ease;
        pointer-events: none;
      }
      .aura.hover .aura-controls,
      .aura.muted .aura-controls {
        opacity: 1;
        pointer-events: auto;
      }
      .aura-controls button {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgb(255 255 255 / 0.18);
        border-radius: 50%;
        background: rgb(16 17 19 / 0.86);
        color: #f4f5f7;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .aura-controls button:hover {
        background: rgb(40 42 46 / 0.95);
      }
      .aura-controls button[aria-pressed="true"] {
        background: #cf514d;
      }
      .aura-controls svg {
        width: 14px;
        height: 14px;
      }
    </style>
    <link rel="stylesheet" href="./client/aura.css" />
  </head>
  <body>
    <div id="aura" class="aura">
      <div id="aura-orb" class="aura-orb aura-hit"></div>
      <div class="aura-controls aura-hit">
        <button
          id="aura-mute"
          type="button"
          aria-pressed="false"
          title="Mute microphone"
          aria-label="Mute microphone"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
          </svg>
        </button>
        <button id="aura-stop" type="button" title="Stop Live" aria-label="Stop Live">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
    </div>
    <script src="./aura-shell.js"></script>
    <script type="module" src="./client/index.js"></script>
  </body>
</html>
